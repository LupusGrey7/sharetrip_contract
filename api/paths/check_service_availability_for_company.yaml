openapi: 3.0.3
info:
  title: Check Service Availability For Company operation
  version: 0.1.0
paths:
  /companies/{companyId}/services/{serviceCode}/availability:
    get:
      tags:
        - companies
      summary: Check service availability for company
      description: |
        Business check for ShareTrip: can company use the given service now
        (company known via contracts, service_code exists in dictionary,
        active contract has the service enabled).

        Distinct outcomes:
        - 404 COMPANY_NOT_FOUND — no contracts for this company_id;
        - 404 SERVICE_NOT_FOUND — service_code not in services dictionary;
        - 200 allowed=true/false — company and code exist; false means
          no active link / disabled (see reason).
      operationId: checkServiceAvailabilityForCompany
      parameters:
        - name: companyId
          in: path
          description: External company ID (company_id on contracts)
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
          example: 42
          x-oapi-codegen-extra-tags:
            validate: "required,min=1"
        - name: serviceCode
          in: path
          description: Stable business service code, e.g. trip_creation
          required: true
          schema:
            type: string
            enum:
              - trip_start
              - trip_creation
              - trip_participants
              - notifications
              - premium_support
          example: trip_creation
          x-oapi-codegen-extra-tags:
            validate: "required,oneof=trip_start trip_creation trip_participants notifications premium_support"
      responses:
        "200":
          description: |
            Availability result. allowed=false is a successful business answer,
            not an HTTP error (company and service_code are known).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityResult"
              example:
                company_id: 42
                service_code: trip_creation
                allowed: true
        "400":
          description: Invalid companyId or serviceCode
          content:
            application/json:
              schema:
                $ref: "../components/common.yaml#/components/schemas/Error"
        "404":
          description: |
            Company unknown (COMPANY_NOT_FOUND) or service_code missing
            from dictionary (SERVICE_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: "../components/common.yaml#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "../components/common.yaml#/components/schemas/Error"
        "503":
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: "../components/common.yaml#/components/schemas/Error"
components:
  schemas:
    AvailabilityResult:
      type: object
      description: Result of service availability check for a company
      required:
        - company_id
        - service_code
        - allowed
      properties:
        company_id:
          type: integer
          format: int64
          example: 42
        service_code:
          type: string
          enum:
            - trip_start
            - trip_creation
            - trip_participants
            - notifications
            - premium_support
          description: Business service code
          example: trip_creation
        allowed:
          type: boolean
          description: true if company can use the service now
          example: true
        reason:
          type: string
          description: Optional reason when allowed=false
          example: no active contract with this service
