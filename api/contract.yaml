openapi: 3.0.3
info:
  title: ShareTrip API
  version: 0.1.0
  description: |
    ShareTrip Contract Service API. Manages company contracts and service availability.

    OpenAPI file: api/contract.yaml
    Local Swagger UI: http://localhost:8086 (Try it out → http://localhost:8082)
    Live spec from app: GET /api/v2/contracts/openapi

    Production base URL: https://contracts.service.io/api/v2

    Outside-In / Contract First (tsk-505766): HTTP contract first, then handlers.
    Create uses resource path POST /contracts (not RPC-style /create_contract).
  contact:
    email: contracts_service@mail.io

servers:
  - url: http://localhost:8082/api/v2
    description: Local Contract Service
  - url: https://contracts.service.io/api/v2
    description: Production

tags:
  - name: contracts
    description: Contract operations
  - name: services
    description: Services available under a contract
  - name: companies
    description: Company-scoped contract checks
  - name: docs
    description: API documentation (OpenAPI artifact)

paths:
  /contracts/openapi:
    get:
      tags:
        - docs
      summary: Get OpenAPI specification (contract.yaml)
      description: |
        Returns the contents of api/contract.yaml from the service process working directory.

        This does NOT open Swagger Editor in the browser by itself — it serves the YAML file.
        To view in Swagger Editor: https://editor.swagger.io → File → Import file
        (use the repo file api/contract.yaml, or save this response and import it).

        See also: .docs/cheatsheets/swagger-ui-cheatsheet.md
      operationId: getOpenAPISpec
      responses:
        "200":
          description: OpenAPI 3.0 document (YAML)
          content:
            application/yaml:
              schema:
                type: string
                format: binary
            text/yaml:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                type: object
        "404":
          description: Spec file not found on disk (wrong working directory)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /contracts:
    post:
      tags:
        - contracts
      summary: Create contract for company
      description: |
        Creates a new contract for a company.

        REST resource collection: POST /contracts (not /create_contract).
      operationId: createContract
      requestBody:
        required: true
        description: Contract create payload
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateContractRequest"
      responses:
        "201":
          description: Contract created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateContractResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Company not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /contracts/{contractId}:
    get:
      tags:
        - contracts
      summary: Get contract by ID
      description: Returns contract by internal contract ID.
      operationId: getContractByID
      parameters:
        - name: contractId
          in: path
          description: Contract ID
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateContractResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Contract not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      tags:
        - contracts
      summary: Change contract status
      description: |
        Updates only the status of an existing contract.

        Closest existing operation to a dedicated "sign" step: status transition
        (e.g. draft → active). A separate POST /sign_contract can be added later
        if product needs an explicit sign use-case.
      operationId: updateContractStatusById
      parameters:
        - name: contractId
          in: path
          description: Contract ID
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        description: New contract status
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractStatusRequest"
      responses:
        "200":
          description: Status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractUpdateStatusResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Contract not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /contracts/{contractId}/signature:
    post:
      tags:
        - contracts_signature
      summary: Sign contract
      description: Signs an existing contract.
      operationId: signContract
      parameters:
        - name: contractId
          in: path
          description: Contract ID
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        description: Contract sign payload
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignContractRequest"
      responses:
        "200":
          description: Contract signed
          content:
            application/json:
              schema:
              $ref: "#/components/schemas/SignContractResponse"
          "400":
            description: Invalid request
            content:
              application/json:
                schema:
                $ref: "#/components/schemas/Error"
          "404":
            description: Contract not found
            content:
              application/json:
                schema:
                $ref: "#/components/schemas/Error"
          "500":
            description: Internal server error
            content:
              application/json:
                schema:
                $ref: "#/components/schemas/Error"
          "503":
            description: Service unavailable
            content:
              application/json:
                schema:
                $ref: "#/components/schemas/Error"

  /contracts/active:
    get:
      tags:
        - contracts
      summary: Get active contract by company ID
      description: Returns the active contract for a company.
      operationId: getActiveContractByCompanyId
      parameters:
        - name: companyId
          in: query
          description: Company ID
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateContractResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Active contract not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /services:
    put:
      tags:
        - services
      summary: Add or update list of services for a contract
      description: |
        Replaces/updates the list of available services for a contract.
        Request must contain contract context and an array of services with enable flags.
      operationId: upsertContractServices
      requestBody:
        required: true
        description: Contract ID and list of services to enable/disable
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertServicesRequest"
      responses:
        "200":
          description: Services list updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpsertServicesResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Contract or service not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /companies/{companyId}/services/{serviceCode}/availability:
    get:
      tags:
        - companies
      summary: Check service availability for company
      description: |
        Business check for ShareTrip: can company use the given service now
        (company known via contracts, service_code exists in dictionary,
        active contract has the service enabled).

        Distinct outcomes:
        - 404 COMPANY_NOT_FOUND — no contracts for this company_id;
        - 404 SERVICE_NOT_FOUND — service_code not in services dictionary;
        - 200 allowed=true/false — company and code exist; false means
          no active link / disabled (see reason).
      operationId: checkServiceAvailabilityForCompany
      parameters:
        - name: companyId
          in: path
          description: External company ID (company_id on contracts)
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
          example: 42
        - name: serviceCode
          in: path
          description: Stable business service code, e.g. trip_creation
          required: true
          schema:
            type: string
            enum:
              - trip_start
              - trip_creation
              - trip_participants
              - notifications
              - premium_support
          example: trip_creation
      responses:
        "200":
          description: |
            Availability result. allowed=false is a successful business answer,
            not an HTTP error (company and service_code are known).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityResult"
              example:
                company_id: 42
                service_code: trip_creation
                allowed: true
        "400":
          description: Invalid companyId or serviceCode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: |
            Company unknown (COMPANY_NOT_FOUND) or service_code missing
            from dictionary (SERVICE_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  schemas:
    Error:
      type: object
      description: Common error body for all failed responses
      properties:
        code:
          type: string
          description: Error code
          enum:
            - COMPANY_VALIDATE_ERROR
            - COMPANY_NOT_FOUND
            - CONTRACT_NOT_FOUND
            - SERVICE_NOT_FOUND
            - SERVICE_DISABLED
            - INTERNAL_SERVER_ERROR
            - SERVICE_UNAVAILABLE
        message:
          type: string
          description: Human-readable error message

    ContractStatus:
      type: string
      description: Contract status
      enum:
        - draft
        - active
        - suspended
        - terminated

    CreateContractRequest:
      type: object
      required:
        - company_id
        - client_id
        - start_date
        - expired_at
      properties:
        contract_number:
          type: string
          description: Business contract number
        company_id:
          type: integer
          format: int64
          description: Company ID
        client_id:
          type: string
          format: uuid
          description: Client ID
        status:
          $ref: "#/components/schemas/ContractStatus"
        start_date:
          type: string
          format: date-time
          description: Contract start date
        expired_at:
          type: string
          format: date-time
          nullable: true
          description: Contract expiration date
      additionalProperties: false

    ContractStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          $ref: "#/components/schemas/ContractStatus"

    CreateContractResponse:
      type: object
      description: Full contract representation
      required:
        - contract
      properties:
        contract:
          $ref: "#/components/schemas/ContractResponse"
      additionalProperties: false

    ContractResponse:
      type: object
      description: Full contract representation
      properties:
        id:
          type: integer
          format: int64
          description: Internal contract ID
        contract_number:
          type: string
        company_id:
          type: integer
          format: int64
        status:
          $ref: "#/components/schemas/ContractStatus"
        start_date:
          type: string
          format: date-time
          nullable: true
        expired_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true

    SignContractRequest:
      type: object
      description: Request for signing a contract
      required:
        - sign_contract
      properties:
        sign_contract:
          $ref: "#/components/schemas/ContractForSignature"

    ContractForSignature:
      type: object
      description: Contract data needed for signing
      properties:
        id:
          type: integer
          format: int64
          description: Internal contract ID
        client_id:
          type: string
          format: uuid
          description: Client ID
        contract_number:
          type: string
        company_id:
          type: integer
          format: int64
        start_date:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
            type: string
            format: date-time
            nullable: true
        expired_at:
          type: string
          format: date-time
          nullable: true

    SignContractResponse:
      type: object
      description: Response for signing a contract
      required:
        - contract
      properties:
        contract:
          $ref: "#/components/schemas/ContractResponse"

    ContractStatusResponse:
      type: object
      description: Same shape as ContractResponse (legacy name in paths)
      properties:
        id:
          type: integer
          format: int64
          description: Internal contract ID
        contract_number:
          type: string
        company_id:
          type: integer
          format: int64
        status:
          $ref: "#/components/schemas/ContractStatus"
        start_date:
          type: string
          format: date-time
          nullable: false
        expired_at:
          type: string
          format: date-time
          nullable: false
        created_at:
          type: string
          format: date-time
          nullable: false
        updated_at:
          type: string
          format: date-time
          nullable: false

    ContractUpdateStatusResponse:
      type: object
      required:
        - contract_status_update
      properties:
        contract_status_update:
          $ref: "#/components/schemas/ContractStatusUpdateResponse"

    ContractStatusUpdateResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        contract_number:
          type: string
        status:
          $ref: "#/components/schemas/ContractStatus"

    ServiceItem:
      type: object
      required:
        - service_code
        - is_enabled
      properties:
        service_code:
          type: string
          enum:
            - trip_start
            - trip_creation
            - trip_participants
            - notifications
            - premium_support
          description: Business service code
          example: trip_creation
        is_enabled:
          type: boolean
          default: false
          description: Whether this service is enabled for the contract
          example: false

    UpsertServicesRequest:
      type: object
      required:
        - contract_id
        - services
      properties:
        contract_id:
          type: integer
          format: int64
          description: Contract whose service list is updated
        services:
          type: array
          description: Full list of services to add/update for the contract
          items:
            $ref: "#/components/schemas/ServiceItem"

    UpsertServicesResponse:
      type: object
      properties:
        contract_id:
          type: integer
          format: int64
        services:
          type: array
          items:
            $ref: "#/components/schemas/ServiceItem"

    AvailabilityResult:
      type: object
      description: Result of service availability check for a company
      required:
        - company_id
        - service_code
        - allowed
      properties:
        company_id:
          type: integer
          format: int64
          example: 42
        service_code:
          type: string
          enum:
            - trip_start
            - trip_creation
            - trip_participants
            - notifications
            - premium_support
          description: Business service code
          example: trip_creation
        allowed:
          type: boolean
          description: true if company can use the service now
          example: true
        reason:
          type: string
          description: Optional reason when allowed=false
          example: no active contract with this service
