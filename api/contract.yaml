openapi: 3.0.3
info:
  title: ShareTrip API
  version: 0.1.0
  description: |
    ShareTrip Contract Service API. Manages company contracts and service availability.

    OpenAPI file: api/contract.yaml
    Local Swagger UI: http://localhost:8086 (Try it out → http://localhost:8082)
    Live spec from app: GET /api/v2/contracts/openapi

    Production base URL: https://contracts.service.io/api/v2

    Outside-In / Contract First (tsk-505766): HTTP contract first, then handlers.
    Create uses resource path POST /contracts (not RPC-style /create_contract).
  contact:
    email: contracts_service@mail.io

servers:
  - url: http://localhost:8082/api/v2
    description: Local Contract Service
  - url: https://contracts.service.io/api/v2
    description: Production

tags:
  - name: contracts
    description: Contract operations
  - name: services
    description: Services available under a contract
  - name: companies
    description: Company-scoped contract checks
  - name: docs
    description: API documentation (OpenAPI artifact)

paths:
  /contracts/openapi:
    $ref: "./paths/get_openapi_spec.yaml#/paths/~1contracts~1openapi"
  /contracts:
    $ref: "./paths/create_contract.yaml#/paths/~1contracts"
  /contracts/active:
    $ref: "./paths/get_active_contract_by_company_id.yaml#/paths/~1contracts~1active"
  /contracts/{contractId}:
    $ref: "./paths/contract_by_id.yaml#/paths/~1contracts~1{contractId}"
  /contracts/{contractId}/signature:
    $ref: "./paths/sign_contract.yaml#/paths/~1contracts~1{contractId}~1signature"
  /services:
    $ref: "./paths/upsert_contract_services.yaml#/paths/~1services"
  /companies/{companyId}/services/{serviceCode}/availability:
    $ref: "./paths/check_service_availability_for_company.yaml#/paths/~1companies~1{companyId}~1services~1{serviceCode}~1availability"
components:
  schemas:
    Error:
      $ref: "./components/common.yaml#/components/schemas/Error"
    ContractStatus:
      $ref: "./components/common.yaml#/components/schemas/ContractStatus"
    ContractResponse:
      $ref: "./components/common.yaml#/components/schemas/ContractResponse"
