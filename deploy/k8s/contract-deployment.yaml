# Deployment: Contract API pods + envFrom ConfigMap/Secret (copy secret.example → contract-secret.yaml before apply).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: contract-deployment
  namespace: sharetrip
  labels:
    app: contract
spec:
  replicas: 2
  selector:
    matchLabels:
      app: contract
  template:
    metadata:
      labels:
        app: contract
    spec:
      containers:
        - name: contract
          image: sharetrip/contract:local
          imagePullPolicy: IfNotPresent
          ports:
            # must match HTTP_PORT in contract-config.yaml
            - name: http
              containerPort: 8082
          envFrom:
            - configMapRef:
                name: contract-config
            - secretRef:
                name: contract-secret
          # /healthcheck pings Postgres: pod gets no traffic while DB is unreachable
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          # tcpSocket, not /healthcheck: a DB outage must not restart every pod
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
