# Secret template with placeholders only — copy to contract-secret.yaml locally (do not commit secrets).
apiVersion: v1
kind: Secret
metadata:
  name: contract-secret
  namespace: sharetrip
type: Opaque
stringData:
  # OrbStack / Docker Desktop k8s → Postgres from deploy/docker compose: host.docker.internal:6547 (published port).
  # Postgres inside the cluster → <postgres-service>:5432 (container port, not 6547).
  DATABASE_DSN: "postgres://<db-user>:<db-password>@host.docker.internal:6547/sharetrip_contract?sslmode=disable"
