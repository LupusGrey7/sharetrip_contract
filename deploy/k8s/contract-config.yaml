# Non-secret ENV for Contract (keys match config.LoadAppConfig).
apiVersion: v1
kind: ConfigMap
metadata:
  name: contract-config
  namespace: sharetrip
data:
  ENV: "production"
  # no .env.* file in the image: APP_ENV only names the profile, values come from here
  APP_ENV: "prod"
  # must match containerPort in contract-deployment.yaml
  HTTP_PORT: "8082"
  OTEL_SERVICE_NAME: "sharetrip-contract"
  OTEL_SERVICE_VERSION: "1.0.0"
  OTEL_ENVIRONMENT: "k8s-local"
  # shared ShareTrip otel-collector published on the host (OrbStack / Docker Desktop k8s)
  OTEL_EXPORTER_ENDPOINT: "host.docker.internal:4319"
